name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bifrost-launcher-apk
          path: app/build/outputs/apk/debug/*.apk
      # Every main build replaces the "latest" release, so the APK is always one click away.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk bifrost-launcher.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest bifrost-launcher.apk --target "$GITHUB_SHA" \
            --title "Latest build" --notes "Built from $GITHUB_SHA."
